<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hotel Management System{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; }
        
        /* Navbar */
        .navbar { background-color: #1e293b; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
        .navbar-brand { color: #ffffff; font-size: 22px; font-weight: bold; text-decoration: none; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #cbd5e1; text-decoration: none; font-weight: 500; padding: 8px 14px; border-radius: 6px; transition: 0.2s; }
        .nav-links a:hover { background-color: #334155; color: #ffffff; }

        /* Main Container */
        .container { max-width: 1100px; margin: 35px auto; padding: 0 20px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .page-header h2 { color: #1e293b; font-size: 26px; }

        /* Dashboard Cards */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); border-left: 5px solid #2563eb; }
        .card.green { border-left-color: #10b981; }
        .card.purple { border-left-color: #8b5cf6; }
        .card.orange { border-left-color: #f59e0b; }
        .card h4 { color: #64748b; font-size: 14px; text-transform: uppercase; margin-bottom: 10px; }
        .card .number { font-size: 32px; font-weight: bold; color: #1e293b; }

        /* Buttons */
        .btn { display: inline-block; padding: 10px 18px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; border: none; cursor: pointer; transition: 0.2s; }
        .btn-primary { background-color: #2563eb; color: white; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .btn-success { background-color: #10b981; color: white; }
        .btn-success:hover { background-color: #059669; }
        .btn-warning { background-color: #f59e0b; color: white; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-secondary { background-color: #64748b; color: white; }
        .btn-sm { padding: 6px 12px; font-size: 13px; }

        /* Tables */
        .table-box { background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background-color: #1e293b; color: white; text-align: left; padding: 14px 18px; font-size: 14px; }
        td { padding: 14px 18px; border-bottom: 1px solid #e2e8f0; font-size: 15px; }
        tr:hover { background-color: #f8fafc; }

        /* Badges */
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-green { background-color: #d1fae5; color: #065f46; }
        .badge-yellow { background-color: #fef3c7; color: #92400e; }
        .badge-blue { background-color: #dbeafe; color: #1e40af; }

        /* Forms */
        .form-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); max-width: 600px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; color: #334155; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #2563eb; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'dashboard' %}" class="navbar-brand">🏨 Hotel Management</a>
        <div class="nav-links">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'category_list' %}">Categories</a>
            <a href="{% url 'room_list' %}">Rooms</a>
            <a href="{% url 'customer_list' %}">Customers</a>
            <a href="{% url 'reservation_list' %}">Reservations</a>
            <form method="POST" action="{% url 'logout' %}" style="margin: 0;">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-sm">Logout</button>
            </form>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
