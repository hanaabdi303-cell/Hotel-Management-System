{% extends 'hotel/base.html' %}
{% block title %}Delete Customer{% endblock %}

{% block content %}
<div class="form-card">
    <h3 style="margin-bottom: 15px;">Ma hubtaa inaad tirtirto macmiilka: {{ customer.full_name }}?</h3>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'customer_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
