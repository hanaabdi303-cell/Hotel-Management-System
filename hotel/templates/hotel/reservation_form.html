{% extends 'hotel/base.html' %}
{% block title %}New Reservation{% endblock %}

{% block content %}
<div class="page-header">
    <h2>Book a Room</h2>
</div>

<div class="form-card">
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Select Customer</label>
            <select name="customer" required>
                <option value="">-- Choose Customer --</option>
                {% for customer in customers %}
                    <option value="{{ customer.id }}">{{ customer.full_name }} ({{ customer.phone }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Select Available Room</label>
            <select name="room" required>
                <option value="">-- Choose Room --</option>
                {% for room in rooms %}
                    <option value="{{ room.id }}">Room {{ room.room_number }} - {{ room.category }} (${{ room.price }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Check-In Date</label>
            <input type="date" name="check_in_date" required>
        </div>
        <div class="form-group">
            <label>Check-Out Date</label>
            <input type="date" name="check_out_date" required>
        </div>
        <button type="submit" class="btn btn-success">Confirm Booking</button>
        <a href="{% url 'reservation_list' %}" class="btn btn-secondary">Back</a>
    </form>
</div>
{% endblock %}
