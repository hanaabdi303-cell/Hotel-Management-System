{% extends 'hotel/base.html' %}
{% block title %}{% if category %}Edit Category{% else %}Add New Category{% endif %}{% endblock %}

{% block content %}
<div class="page-header">
    <h2>{% if category %}Edit Category{% else %}Add New Category{% endif %}</h2>
</div>

<div class="form-card">
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Category Name</label>
            <input type="text" name="name" value="{{ category.name|default:'' }}" placeholder="e.g. Standard, Deluxe, Suite" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <input type="text" name="description" value="{{ category.description|default:'' }}" placeholder="Short details about this room type">
        </div>
        <button type="submit" class="btn btn-primary">Save Category</button>
        <a href="{% url 'category_list' %}" class="btn btn-secondary">Back</a>
    </form>
</div>
{% endblock %}
